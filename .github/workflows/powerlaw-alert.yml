name: Power Law alert
on:
  schedule:
    - cron: "17 6 * * *"        # every day, ~09:17 Israel time
  workflow_dispatch: {}          # run by hand from the Actions tab
permissions:
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas numpy
      - run: python scripts/powerlaw_alert.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
